services:
  php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: banco_alimentos_php
    working_dir: /var/www/app
    volumes:
      - ./app:/var/www/app
    depends_on:
      - database

  nginx:
    image: nginx:1.27-alpine
    container_name: banco_alimentos_nginx
    ports:
      - "8080:80"
    volumes:
      - ./app:/var/www/app
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - php

  database:
    image: postgres:16-alpine
    container_name: banco_alimentos_db
    environment:
      POSTGRES_DB: banco_alimentos
      POSTGRES_USER: banco_user
      POSTGRES_PASSWORD: banco_password
    ports:
      - "5432:5432"
    volumes:
      - banco_alimentos_db_data:/var/lib/postgresql/data

volumes:
  banco_alimentos_db_data:
